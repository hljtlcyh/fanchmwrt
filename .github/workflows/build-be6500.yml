name: Build BE6500 OpenWrt
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: fanchmwrt-25.12.4
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison git libncurses-dev gawk unzip libssl-dev python3-distutils rsync ccache
      - name: 更新feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: 生成基础配置
        run: make defconfig
      - name: 写入BE6500设备配置
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ipq53xx=y
          CONFIG_TARGET_ipq53xx_generic=y
          CONFIG_TARGET_ipq53xx_generic_DEVICE_jdcloud_be6500=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF
          make olddefconfig
      - name: 下载源码包
        run: make -j1 download
      - name: 编译固件
        run: |
          make -j$(nproc) V=s || make -j1 V=s
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: BE6500-firmware
          path: bin/targets/ipq53xx/generic/
